<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLUB99</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Интро-экран -->
    <div id="intro-screen" onclick="closeIntro()">
        <div class="intro-container">
            <div class="intro-logo-wrapper">
                <img src="klub99.png" alt="KLUB99" id="intro-logo">
            </div>
        </div>
    </div>

    <!-- Шапка -->
    <header>
        <button class="hamburger" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Боковое меню -->
    <div class="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" onclick="switchSection('home', event)">ГЛАВНАЯ</a>
            <a href="#" class="nav-item" onclick="switchSection('contacts', event)">КОНТАКТЫ</a>
        </nav>
    </div>

    <!-- Основной контент -->
    <main>
        <!-- Главная страница -->
        <section id="home-section" class="main-section active">
            <div class="main-logo-wrapper">
                <img src="klub99.png" alt="KLUB99" class="main-big-logo">
            </div>
            <div class="grid">
                <a href="https://youtube.com" target="_blank" class="card youtube"><h3>YOUTUBE</h3></a>
                <a href="https://t.me" target="_blank" class="card telegram"><h3>TELEGRAM</h3></a>
                <a href="https://soundcloud.com" target="_blank" class="card soundcloud"><h3>SOUNDCLOUD</h3></a>
            </div>
        </section>

        <!-- Страница контактов -->
        <section id="contacts-section" class="main-section">
            <div class="contact-text-block">
                <p class="contact-title"></p>
                <p class="contact-email">klub99@gmail.com</p>
            </div>
        </section>
    </main>

    <script>
        // Логика интро
        function closeIntro() {
            document.getElementById('intro-screen').classList.add('fade-out');
        }

        // Логика меню
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // Логика переключения вкладок
        function switchSection(sectionName, event) {
            event.preventDefault();
            document.querySelectorAll('.main-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            if (sectionName === 'home') {
                document.getElementById('home-section').classList.add('active');
            } else if (sectionName === 'contacts') {
                document.getElementById('contacts-section').classList.add('active');
            }
            
            event.currentTarget.classList.add('active');
            toggleSidebar();
        }

        // 3D Проседание логотипа при наведении мыши
        document.addEventListener('DOMContentLoaded', () => {
            const mainLogo = document.querySelector('.main-big-logo');
            if (mainLogo) {
                mainLogo.addEventListener('mousemove', (e) => {
                    const rect = mainLogo.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    const maxRotate = 22;
                    const rotateX = y * maxRotate;
                    const rotateY = x * -maxRotate;
                    // Вдавливание по оси Z и наклон относительно курсора
                    mainLogo.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(-25px) scale(0.97)`;
                });

                mainLogo.addEventListener('mouseleave', () => {
                    // Плавный возврат в исходное положение
                    mainLogo.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0px) scale(1)';
                });
            }
        });
    </script>
</body>
</html>
